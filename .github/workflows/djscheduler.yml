name: DJScheduler checks

on:
  push:
    paths:
      - "djscheduler/**"
      - "tests/djscheduler/**"
      - ".github/workflows/djscheduler.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "djscheduler/**"
      - "tests/djscheduler/**"
      - ".github/workflows/djscheduler.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tests/djscheduler/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r tests/djscheduler/requirements.txt
      - name: Check formatting
        run: python -m black --check djscheduler tests/djscheduler
      - name: Lint
        run: python -m ruff check djscheduler tests/djscheduler
      - name: Regression tests
        run: python -m pytest tests/djscheduler -q -o asyncio_default_fixture_loop_scope=function
